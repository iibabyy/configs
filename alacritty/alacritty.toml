[font]
size = 12.0
normal = {
  family = "Hack Nerd Font Mono"
}

[colors.primary]
background = "#1e1e2e"
foreground = "#ffffff"

[selection]
save_to_clipboard = true

[terminal.shell]
program = "nu"
args = [
  # "--config", "/dev/null", # so nushell only load env.nu
  "--execute", "zellij attach --create main --layout main"
]

[mouse]
hide_when_typing = true

[window]
decorations = "None"
startup_mode = "Maximized"

[keyboard]
bindings = [
  { key = "v", mods = "Control", action = "Paste" }
]
